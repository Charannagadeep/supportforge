[project]
name = "supportforge"
version = "0.3.0"
description = "Local evidence lab for GPU/AI-server support — cited handoffs, live eval, laptop-first"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "watchdog>=5.0.0",
  "pydantic>=2.9.0",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
supportforge = "app.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: requires local Ollama model",
]
